<div class="laboratory-block">

  <div class="block-header" role="button" tabindex="0"
       [attr.aria-expanded]="isExpanded"
       (click)="toggle()"
       (keydown.enter)="toggle()"
       (keydown.space)="toggle(); $event.preventDefault()">
    <i class="pi pi-chevron-down"
       [class.rotated]="isExpanded"
       style="margin-right: 8px; font-size: 12px; color: var(--app-text);">
    </i>
    <span class="block-title">
      {{ 'MAIN.EXAMINATION.EXPERT_EXAMINATION.LABORATORY_DATA.URINE_TEST' | translate }}
    </span>
  </div>

  <div class="block-content" *ngIf="isExpanded">
    <form [formGroup]="form" class="fields-container">

      <div class="checkbox-row">
        <p-checkbox
          inputId="urineTestNormal"
          [(ngModel)]="isUrineTestNormal"
          (ngModelChange)="onUrineTestNormalChange($event)"
          [binary]="true"
          [ngModelOptions]="{standalone: true}">
        </p-checkbox>
        <label for="urineTestNormal" class="checkbox-label">
          {{ 'MAIN.EXAMINATION.EXPERT_EXAMINATION.LABORATORY_DATA.IN_NORMAL_RANGE' | translate }}
        </label>
      </div>

      <div class="fields-grid">
        <div class="field-group" *ngFor="let field of urineFields">
          <label [attr.for]="field.key" class="field-label">
            {{ field.labelKey | translate }}
          </label>
          <input
            [attr.id]="field.key"
            type="text"
            [formControlName]="field.key"
            pInputText
            [placeholder]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.LABORATORY_DATA.ENTER_VALUE' | translate"
            class="w-full"
          />
        </div>
      </div>

      <div class="field-group full-width">
        <textarea
          formControlName="history"
          pInputTextarea
          [autoResize]="true"
          [rows]="2"
          [placeholder]="'MAIN.EXAMINATION.EXPERT_EXAMINATION.LABORATORY_DATA.ENTER_VALUE' | translate"
          class="w-full history-textarea"
        ></textarea>
      </div>

    </form>
  </div>

</div>
